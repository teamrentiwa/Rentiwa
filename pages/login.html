<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RENTIWA Narela</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--bg-secondary);">

  <div id="navbar-container"></div>

  <main class="container-narrow" style="padding:60px 20px;">
    <div class="form-card" style="max-width:440px; margin:0 auto;">
      <div style="text-align:center; margin-bottom:28px;">
        <div style="margin:0 auto 12px;">
          <img src="/assets/logo.png" onerror="this.onerror=null; this.src='https://i.ibb.co/ZRpnbdjd/Rentiwa-logo.png';" alt="Rentiwa Logo" style="height:48px; width:auto; margin:0 auto;">
        </div>
        <h1 class="heading-md">Welcome Back to Rentiwa</h1>
        <p class="subheading" style="font-size:0.88rem; margin-top:4px;">
          Log in to connect with item owners in Narela
        </p>
      </div>

      <!-- GOOGLE SIGN IN BUTTON -->
      <button type="button" id="google-login-btn" onclick="handleGoogleLogin()" class="btn btn-secondary btn-full btn-lg" style="justify-content:center; gap:10px; font-weight:600; margin-bottom:20px; display:inline-flex; align-items:center;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
        <div style="flex:1; height:1px; background:var(--border-light);"></div>
        <span style="font-size:0.75rem; color:var(--text-light); font-weight:600;">OR PHONE / EMAIL</span>
        <div style="flex:1; height:1px; background:var(--border-light);"></div>
      </div>

      <!-- PHONE / EMAIL FORM -->
      <form onsubmit="handleEmailPhoneLogin(event)" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-group">
          <label class="form-label" for="login-input">Mobile Number or Email *</label>
          <input type="text" id="login-input" class="form-input" placeholder="e.g. +91 98765 00112 or aarav@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password / OTP *</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Log In
        </button>
      </form>

      <div style="text-align:center; font-size:0.88rem; color:var(--text-muted); margin-top:20px;">
        Don't have an account? <a href="/pages/signup.html" style="color:var(--primary); font-weight:600;">Sign up free</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    async function handleGoogleLogin() {
      const btn = document.getElementById('google-login-btn');
      const btnText = document.getElementById('google-btn-text');
      if (btn) btn.disabled = true;
      if (btnText) btnText.textContent = 'Signing in...';

      try {
        const user = await Rentiwa.loginWithGoogle();
        if (user) {
          window.location.href = '/pages/profile.html';
        }
      } catch (err) {
        console.error("Google Login Error:", err);
      } finally {
        if (btn) btn.disabled = false;
        if (btnText) btnText.textContent = 'Continue with Google';
      }
    }

    function handleEmailPhoneLogin(e) {
      e.preventDefault();
      const inputVal = document.getElementById('login-input').value;
      const user = {
        name: inputVal.includes('@') ? inputVal.split('@')[0] : 'Resident User',
        email: inputVal.includes('@') ? inputVal : 'user@rentiwa.com',
        phone: inputVal.includes('@') ? '+91 98765 43210' : inputVal,
        city: 'Narela, Delhi',
        plan: 'free',
        listingsCount: 1,
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'
      };
      Rentiwa.setUser(user);
      Rentiwa.showToast('Login successful!', 'success');
      setTimeout(() => {
        window.location.href = '/pages/profile.html';
      }, 600);
    }
  </script>
</body>
</html>
