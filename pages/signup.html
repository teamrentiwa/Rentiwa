<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - RENTIWA Narela</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--bg-secondary);">

  <div id="navbar-container"></div>

  <main class="container-narrow" style="padding:60px 20px;">
    <div class="form-card" style="max-width:480px; margin:0 auto;">
      <div style="text-align:center; margin-bottom:28px;">
        <div style="margin:0 auto 12px;">
          <img src="/assets/logo.png" onerror="this.onerror=null; this.src='https://i.ibb.co/ZRpnbdjd/Rentiwa-logo.png';" alt="Rentiwa Logo" style="height:48px; width:auto; margin:0 auto;">
        </div>
        <h1 class="heading-md">Join Rentiwa Community</h1>
        <p class="subheading" style="font-size:0.88rem; margin-top:4px;">
          Rent or list items in Narela (Delhi). Free 5 listings included!
        </p>
      </div>

      <form onsubmit="handleSignupSubmit(event)" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="form-input" placeholder="e.g. Aarav Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-input" placeholder="aarav@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Mobile Number *</label>
          <input type="tel" id="signup-phone" class="form-input" placeholder="+91 98765 00112" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-area">Area in Narela *</label>
          <select id="signup-area" class="form-select" required>
            <option value="Narela Sector A6">Narela Sector A6</option>
            <option value="Safiabad Road">Safiabad Road</option>
            <option value="Lampur Road">Lampur Road</option>
            <option value="DSIIDC">DSIIDC Industrial Area</option>
            <option value="Narela Mandi">Narela Mandi</option>
            <option value="Swatantra Nagar">Swatantra Nagar</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Create Account
        </button>
      </form>

      <div style="text-align:center; font-size:0.88rem; color:var(--text-muted); margin-top:20px;">
        Already have an account? <a href="/pages/login.html" style="color:var(--primary); font-weight:600;">Log in</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    function handleSignupSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const phone = document.getElementById('signup-phone').value;
      const area = document.getElementById('signup-area').value;

      const user = {
        name: name,
        email: email,
        phone: phone,
        city: 'Narela, Delhi',
        area: area,
        plan: 'free',
        listingsCount: 0,
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'
      };

      Rentiwa.setUser(user);
      Rentiwa.showToast('🎉 Account created successfully!', 'success');
      setTimeout(() => {
        window.location.href = '/pages/profile.html';
      }, 600);
    }
  </script>
</body>
</html>
